<!DOCTYPE html>
<!-- ຄຳເຫັດທີ່ສື່ສະນາໃນພາສາລາວ -->
<!-- ນີ້ແມ່ນເອກະສານ HTML ຫຼັກສໍາລັບການນໍາໃຊ້ Hello World -->
<!-- ການໄລ່ຖະສະໜີ HTML ໂຕກໍາ່າວວ່ານີ້ເປັນເອກະສານ HTML5 -->
<html lang="lo">
<head>
    <!-- ພາກ head ມີຂໍ້ມູນກ່ຽວກັບເອກະສານ -->
    <!-- ລະບຸລະຫັດຜ່ານຕົວອັກສອນສໍາລັບການສະແດງຂໍ້ຄວາມທີ່ຖືກຕ້ອງ -->
    <meta charset="UTF-8">
    <!-- ການຕັ້ງຄ່າ viewport ສໍາລັບການອອກແບບມືຖືທີ່ໂຕ້ຕອບ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ຫົວຂໍ້ໜ້າທີ່ສະແດງໃນແທັບເບາວເຊີ -->
    <title>Hello World - ພາສາລາວ</title>
</head>
<body>
    <!-- ພາກ body ມີເນື້ອຫາຫຼັກ -->
    <!-- ອົງປະກອບຫົວຂໍ້ທີ່ສະແດງຂໍ້ຄວາມຫຼັກ -->
    <h1>ສະຫວັດດີຊາວໂລກ!</h1>
    <!-- ວັກກ່າຍುງເພີ່ມເຕີມທີ່ມີລາຍລະອຽດ -->
    <p>ຍິນດີຕ້ອນຮັບເຂົ້າໃນການນໍາໃຊ້ Hello World ທີ່ມີຄຳເຫັດທີ່ສື່ສະນາໃນພາສາລາວ.</p>
</body>
</html>
