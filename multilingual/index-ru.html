<!DOCTYPE html>
<!-- Комментарии на русском языке -->
<!-- Это основной документ HTML для приложения Hello World -->
<!-- Объявление HTML указывает, что это документ HTML5 -->
<html lang="ru">
<head>
    <!-- Раздел head содержит метаданные о документе -->
    <!-- Спецификация кодировки символов для правильного отображения текста -->
    <meta charset="UTF-8">
    <!-- Параметры viewport для отзывчивого мобильного дизайна -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Заголовок страницы, отображаемый на вкладке браузера -->
    <title>Hello World - Русский</title>
</head>
<body>
    <!-- Раздел body содержит основной контент -->
    <!-- Элемент заголовка, отображающий основное сообщение -->
    <h1>Привет мир!</h1>
    <!-- Дополнительный абзац с описанием -->
    <p>Добро пожаловать в приложение Hello World с комментариями на русском языке.</p>
</body>
</html>
