<!DOCTYPE html>
<!-- 한국어 주석 -->
<!-- 이것은 Hello World 응용 프로그램을 위한 주요 HTML 문서입니다 -->
<!-- HTML 선언은 이것이 HTML5 문서임을 지정합니다 -->
<html lang="ko">
<head>
    <!-- head 섹션에는 문서에 대한 메타데이터가 포함됩니다 -->
    <!-- 적절한 텍스트 렌더링을 위한 문자 인코딩 사양 -->
    <meta charset="UTF-8">
    <!-- 반응형 모바일 디자인을 위한 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시되는 페이지 제목 -->
    <title>Hello World - 한국어</title>
</head>
<body>
    <!-- body 섹션에는 주요 콘텐츠가 포함됩니다 -->
    <!-- 주요 메시지를 표시하는 제목 요소 -->
    <h1>안녕하세요 세계!</h1>
    <!-- 설명이 있는 추가 단락 -->
    <p>한국어 주석을 포함한 Hello World 응용 프로그램에 오신 것을 환영합니다.</p>
</body>
</html>
