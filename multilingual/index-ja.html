<!DOCTYPE html>
<!-- 日本語のコメント -->
<!-- これはHello WorldアプリケーションのメインなHTMLドキュメントです -->
<!-- HTML宣言はこれがHTML5ドキュメントであることを指定します -->
<html lang="ja">
<head>
    <!-- headセクションはドキュメントに関するメタデータを含みます -->
    <!-- 適切なテキストレンダリング用の文字エンコーディング仕様 -->
    <meta charset="UTF-8">
    <!-- レスポンシブモバイルデザイン用のビューポート設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ブラウザタブに表示されるページタイトル -->
    <title>Hello World - 日本語</title>
</head>
<body>
    <!-- bodyセクションはメインコンテンツを含みます -->
    <!-- メインメッセージを表示する見出し要素 -->
    <h1>こんにちは世界!</h1>
    <!-- 説明付きの追加段落 -->
    <p>日本語のコメント付きHello Worldアプリケーションへようこそ。</p>
</body>
</html>
