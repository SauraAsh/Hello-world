<!DOCTYPE html>
<!-- Commenti in Italiano -->
<!-- Questo è il documento HTML principale per l'applicazione Hello World -->
<!-- La dichiarazione HTML specifica che questo è un documento HTML5 -->
<html lang="it">
<head>
    <!-- La sezione head contiene metadati sul documento -->
    <!-- Specifica della codifica dei caratteri per un corretto rendering del testo -->
    <meta charset="UTF-8">
    <!-- Impostazioni del viewport per il design responsivo mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titolo della pagina visualizzato nella scheda del browser -->
    <title>Hello World - Italiano</title>
</head>
<body>
    <!-- La sezione body contiene il contenuto principale -->
    <!-- Elemento titolo che visualizza il messaggio principale -->
    <h1>Ciao Mondo!</h1>
    <!-- Paragrafo aggiuntivo con descrizione -->
    <p>Benvenuto nell'applicazione Hello World con commenti in italiano.</p>
</body>
</html>
