<!DOCTYPE html>
<!-- Comentarios en Español -->
<!-- Este es el documento HTML principal para la aplicación Hello World -->
<!-- La declaración HTML especifica que este es un documento HTML5 -->
<html lang="es">
<head>
    <!-- La sección head contiene metadatos sobre el documento -->
    <!-- Especificación de codificación de caracteres para representación correcta de texto -->
    <meta charset="UTF-8">
    <!-- Configuración de viewport para diseño responsivo móvil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la página mostrado en la pestaña del navegador -->
    <title>Hello World - Español</title>
</head>
<body>
    <!-- La sección body contiene el contenido principal -->
    <!-- Elemento de encabezado que muestra el mensaje principal -->
    <h1>¡Hola Mundo!</h1>
    <!-- Párrafo adicional con descripción -->
    <p>Bienvenido a la aplicación Hello World con comentarios en español.</p>
</body>
</html>
