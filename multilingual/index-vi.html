<!DOCTYPE html>
<!-- Bình luận tiếng Việt -->
<!-- Đây là tài liệu HTML chính cho ứng dụng Hello World -->
<!-- Khai báo HTML chỉ định đây là tài liệu HTML5 -->
<html lang="vi">
<head>
    <!-- Phần head chứa siêu dữ liệu về tài liệu -->
    <!-- Thông số kỹ thuật mã hóa ký tự để hiển thị văn bản chính xác -->
    <meta charset="UTF-8">
    <!-- Cài đặt viewport cho thiết kế mobile đáp ứng -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tiêu đề trang được hiển thị trong tab trình duyệt -->
    <title>Hello World - Tiếng Việt</title>
</head>
<body>
    <!-- Phần body chứa nội dung chính -->
    <!-- Phần tử tiêu đề hiển thị thông báo chính -->
    <h1>Xin chào thế giới!</h1>
    <!-- Đoạn bổ sung với mô tả -->
    <p>Chào mừng bạn đến với ứng dụng Hello World có bình luận bằng tiếng Việt.</p>
</body>
</html>
