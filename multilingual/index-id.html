<!DOCTYPE html>
<!-- Komentar dalam Bahasa Indonesia -->
<!-- Ini adalah dokumen HTML utama untuk aplikasi Hello World -->
<!-- Deklarasi HTML menentukan bahwa ini adalah dokumen HTML5 -->
<html lang="id">
<head>
    <!-- Bagian head berisi metadata tentang dokumen -->
    <!-- Spesifikasi penyandian karakter untuk rendering teks yang benar -->
    <meta charset="UTF-8">
    <!-- Pengaturan viewport untuk desain responsif mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Judul halaman ditampilkan di tab browser -->
    <title>Hello World - Bahasa Indonesia</title>
</head>
<body>
    <!-- Bagian body berisi konten utama -->
    <!-- Elemen judul menampilkan pesan utama -->
    <h1>Halo Dunia!</h1>
    <!-- Paragraf tambahan dengan deskripsi -->
    <p>Selamat datang di aplikasi Hello World dengan komentar dalam bahasa Indonesia.</p>
</body>
</html>
