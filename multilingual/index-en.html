<!DOCTYPE html>
<!-- English Comments -->
<!-- This is the main HTML document for the Hello World application -->
<!-- HTML declaration specifies this is an HTML5 document -->
<html lang="en">
<head>
    <!-- Head section contains metadata about the document -->
    <!-- Character encoding specification for proper text rendering -->
    <meta charset="UTF-8">
    <!-- Viewport settings for responsive mobile design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page title displayed in browser tab -->
    <title>Hello World - English</title>
</head>
<body>
    <!-- Body section contains the main content -->
    <!-- Heading element displaying the main message -->
    <h1>Hello World!</h1>
    <!-- Additional paragraph with description -->
    <p>Welcome to the Hello World application with English comments.</p>
</body>
</html>
