<!DOCTYPE html>
<!-- Commentaires en Français -->
<!-- Ceci est le document HTML principal pour l'application Hello World -->
<!-- La déclaration HTML spécifie qu'il s'agit d'un document HTML5 -->
<html lang="fr">
<head>
    <!-- La section head contient les métadonnées du document -->
    <!-- Spécification d'encodage de caractères pour un rendu de texte correct -->
    <meta charset="UTF-8">
    <!-- Paramètres de viewport pour un design réactif mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titre de la page affiché dans l'onglet du navigateur -->
    <title>Hello World - Français</title>
</head>
<body>
    <!-- La section body contient le contenu principal -->
    <!-- Élément de titre affichant le message principal -->
    <h1>Bonjour le Monde!</h1>
    <!-- Paragraphe supplémentaire avec description -->
    <p>Bienvenue dans l'application Hello World avec des commentaires en français.</p>
</body>
</html>
