<!DOCTYPE html>
<!-- Kommentare auf Deutsch -->
<!-- Dies ist das Haupt-HTML-Dokument für die Hello World-Anwendung -->
<!-- Die HTML-Deklaration gibt an, dass dies ein HTML5-Dokument ist -->
<html lang="de">
<head>
    <!-- Der head-Bereich enthält Metadaten über das Dokument -->
    <!-- Zeichenkodierungsspezifikation für korrektes Text-Rendering -->
    <meta charset="UTF-8">
    <!-- Viewport-Einstellungen für responsives Mobildesign -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Seitentitel im Browser-Tab angezeigt -->
    <title>Hello World - Deutsch</title>
</head>
<body>
    <!-- Der body-Bereich enthält den Hauptinhalt -->
    <!-- Überschriftenelement zur Anzeige der Hauptmeldung -->
    <h1>Hallo Welt!</h1>
    <!-- Zusätzlicher Absatz mit Beschreibung -->
    <p>Willkommen bei der Hello World-Anwendung mit deutschen Kommentaren.</p>
</body>
</html>
